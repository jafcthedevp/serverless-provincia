org: jesusflores123
app: zazu-update
service: odoo-zazu

provider:
  name: aws
  runtime: python3.12
  region: us-east-1
  stage: ${opt:stage, 'dev'}
  memorySize: 256
  timeout: 29
  logRetentionInDays: 14
  environment:
    NOTIFICATIONS_TABLE: ${self:service}-notifications-${sls:stage}
    VALIDATIONS_TABLE: ${self:service}-validations-${sls:stage}
    SCREENSHOTS_BUCKET: ${self:service}-screenshots-${sls:stage}
    WHATSAPP_TOKEN: ${ssm:/zazu/whatsapp_token}

    ODOO_CALLBACK_URL: ${ssm:/zazu/odoo_callback_url}
    ODOO_CALLBACK_TOKEN: ${ssm:/zazu/odoo_callback_token}

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:DescribeTable
          Resource:
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${self:service}-*
            - arn:aws:dynamodb:${aws:region}:${aws:accountId}:table/${self:service}-*/index/*

        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:PutObject
            - s3:DeleteObject
            - s3:ListBucket
          Resource:
            - arn:aws:s3:::${self:service}-screenshots-${sls:stage}
            - arn:aws:s3:::${self:service}-screenshots-${sls:stage}/*

        - Effect: Allow
          Action:
            - textract:DetectDocumentText
            - textract:AnalyzeDocument
          Resource: "*"

        - Effect: Allow
          Action:
            - lambda:InvokeFunction
          Resource:
            - arn:aws:lambda:${aws:region}:${aws:accountId}:function:${self:service}-${sls:stage}-*

plugins:
  - serverless-prune-plugin

custom:
  prune:
    automatic: true
    number: 3

# ===== DEFINICIÓN DEL LAYER =====
layers:
  CommonLibs:
    path: layers/common
    name: ${self:service}-common-libs-${sls:stage}
    compatibleRuntimes:
      - python3.12

functions:
  # ===== VALIDACIÓN (Usan validation_handler.py, REQUIEREN LAYER) =====
  validateFromOdoo:
    handler: validation_handler.validate_from_odoo
    layers:
      - { Ref: CommonLibsLambdaLayer }
    events:
      - httpApi:
          path: /validate-from-odoo
          method: post
    timeout: 60

  processWhatsAppImage:
    handler: validation_handler.process_whatsapp_image
    layers:
      - { Ref: CommonLibsLambdaLayer }
    timeout: 60

  processScreenshot:
    handler: validation_handler.process_screenshot
    layers:
      - { Ref: CommonLibsLambdaLayer }
    events:
      - s3:
          bucket: ${self:service}-screenshots-${sls:stage}
          event: s3:ObjectCreated:*
          existing: true
    timeout: 60

  getDuplicateValidations:
    handler: validation_handler.get_duplicate_validations
    layers:
      - { Ref: CommonLibsLambdaLayer }
    events:
      - httpApi:
          path: /validations/duplicates
          method: get

  validatePayment:
    handler: validation_handler.validate_payment
    layers:
      - { Ref: CommonLibsLambdaLayer }
    timeout: 30

  getValidations:
    handler: validation_handler.get_validations
    layers:
      - { Ref: CommonLibsLambdaLayer }
    events:
      - httpApi:
          path: /validations
          method: get

  getValidationById:
    handler: validation_handler.get_validation_by_id
    layers:
      - { Ref: CommonLibsLambdaLayer }
    events:
      - httpApi:
          path: /validations/{id}
          method: get

  getPendingValidations:
    handler: validation_handler.get_pending_validations
    layers:
      - { Ref: CommonLibsLambdaLayer }
    events:
      - httpApi:
          path: /validations/pending
          method: get

  manualReview:
    handler: validation_handler.manual_review
    layers:
      - { Ref: CommonLibsLambdaLayer }
    events:
      - httpApi:
          path: /validations/{id}/review
          method: put

resources:
  Resources:
    # Tabla de Validaciones
    ValidationsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ${self:service}-validations-${sls:stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: id
            AttributeType: S
          - AttributeName: validation_status
            AttributeType: S
          - AttributeName: created_at
            AttributeType: N
          - AttributeName: phone_number
            AttributeType: S
        KeySchema:
          - AttributeName: id
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: ValidationStatusIndex
            KeySchema:
              - AttributeName: validation_status
                KeyType: HASH
              - AttributeName: created_at
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
          - IndexName: PhoneNumberIndex
            KeySchema:
              - AttributeName: phone_number
                KeyType: HASH
              - AttributeName: created_at
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

    # Bucket S3
    ScreenshotsBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:service}-screenshots-${sls:stage}
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: true
          IgnorePublicAcls: true
          RestrictPublicBuckets: true
        LifecycleConfiguration:
          Rules:
            - Id: DeleteOldScreenshots
              Status: Enabled
              ExpirationInDays: 90

package:
  patterns:
    - '!node_modules/**'
    - '!.venv/**'
    - '!.git/**'
    - '!.idea/**'
    - '!.serverless/**'
    - '!__pycache__/**'
    - '!layers/**'
